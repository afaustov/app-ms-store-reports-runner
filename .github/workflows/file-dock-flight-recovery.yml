name: File Dock isolated package flight
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare, commit, status]
        default: status
      flight_id:
        type: string
        required: false
      submission_id:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: file-dock-isolated-flight
  cancel-in-progress: false
jobs:
  flight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process exact package without editing app pricing
        shell: node {0}
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          OPERATION: ${{ inputs.operation }}
          FLIGHT_ID: ${{ inputs.flight_id }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          const crypto=require('node:crypto');
          (async()=>{
            const r=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'}),signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Auth HTTP '+r.status);const token=(await r.json()).access_token;
            const root='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP',name='Recovery 1.0.11 API 20261018';
            async function api(p='',method='GET',body){const res=await fetch(root+p,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(60000)});const raw=await res.text();let d;try{d=JSON.parse(raw)}catch{d={}}console.log('HTTP='+JSON.stringify({p,method,http:res.status,correlation:res.headers.get('MS-CorrelationId')}));if(!res.ok)throw Error(JSON.stringify(d));return d;}
            const app=await api();if(app.lastPublishedApplicationSubmission.id!=='1152921505702146390')throw Error('Published baseline changed');
            let fid=process.env.FLIGHT_ID,sid=process.env.SUBMISSION_ID,d;
            if(process.env.OPERATION==='prepare'){
              const existing=await api('/listflights?skip=0&top=100');
              if(existing.value.some(f=>f.friendlyName===name))throw Error('Recovery flight already exists; inspect instead of duplicating');
              const f=await api('/flights','POST',{friendlyName:name,groupIds:[]});fid=f.flightId;
              console.log('FLIGHT_CREATED='+JSON.stringify({flightId:fid,friendlyName:f.friendlyName,groupIds:f.groupIds}));
              if(!Array.isArray(f.groupIds)||f.groupIds.length!==0)throw Error('Flight must have no audience');
              d=await api('/flights/'+fid+'/submissions','POST');sid=d.id;
              console.log('FLIGHT_DRAFT='+JSON.stringify({flightId:fid,submissionId:sid,status:d.status}));
              if(d.status!=='PendingCommit')throw Error('Unexpected flight draft');
              const upload=d.fileUploadUrl;
              d.flightPackages=(d.flightPackages||[]).map(p=>({...p,fileStatus:'PendingDelete'}));
              d.flightPackages.push({fileName:'File_Dock_Widget_1.0.11.0_neutral.msixbundle',fileStatus:'PendingUpload',minimumDirectXVersion:'None',minimumSystemRam:'None'});
              d.targetPublishMode='Immediate';
              if(d.packageDeliveryOptions){d.packageDeliveryOptions.isMandatoryUpdate=false;d.packageDeliveryOptions.mandatoryUpdateEffectiveDate='1601-01-01T00:00:00.0000000Z';}
              await api('/flights/'+fid+'/submissions/'+sid,'PUT',d);
              d=await api('/flights/'+fid+'/submissions/'+sid);
              if(d.targetPublishMode!=='Immediate'||!d.flightPackages.some(p=>p.fileName==='File_Dock_Widget_1.0.11.0_neutral.msixbundle'&&p.fileStatus==='PendingUpload'))throw Error('Flight package readback failed');
              const nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',Buffer.from(process.env.STATE_ENCRYPTION_KEY,'hex'),nonce);
              const bytes=Buffer.concat([cipher.update(JSON.stringify({flightId:fid,id:sid,url:d.fileUploadUrl||upload})),cipher.final()]);
              console.log('UPLOAD_ENVELOPE='+Buffer.concat([nonce,bytes,cipher.getAuthTag()]).toString('base64'));
            }else{
              if(!/^[a-z0-9-]+$/i.test(fid||'')||!/^\d+$/.test(sid||''))throw Error('Flight/submission IDs required');
              const f=await api('/flights/'+fid);
              if(f.friendlyName!==name||!Array.isArray(f.groupIds)||f.groupIds.length!==0)throw Error('Wrong flight or nonempty audience');
              d=await api('/flights/'+fid+'/submissions/'+sid);
              if(process.env.OPERATION==='commit'){
                if(d.status!=='PendingCommit'||!d.flightPackages.some(p=>p.fileName==='File_Dock_Widget_1.0.11.0_neutral.msixbundle'))throw Error('Flight commit guard failed');
                console.log('COMMIT='+JSON.stringify(await api('/flights/'+fid+'/submissions/'+sid+'/commit','POST')));
              }else if(process.env.OPERATION!=='status')throw Error('Unknown operation');
            }
            let status=await api('/flights/'+fid+'/submissions/'+sid+'/status');console.log('FLIGHT_STATUS='+JSON.stringify({flightId:fid,submissionId:sid,...status}));
            if(process.env.OPERATION==='status'){for(let i=0;i<6&&['CommitStarted','PreProcessing'].includes(status.status);i++){await new Promise(r=>setTimeout(r,20000));status=await api('/flights/'+fid+'/submissions/'+sid+'/status');console.log('FLIGHT_STATUS='+JSON.stringify({flightId:fid,submissionId:sid,...status}));}}
            const final=await api('/flights/'+fid+'/submissions/'+sid);
            console.log('FLIGHT_FINAL='+JSON.stringify({flightId:fid,submissionId:sid,status:final.status,packages:final.flightPackages,statusDetails:final.statusDetails}));
          })().catch(e=>{console.error(e.message.replace(/https:\/\/[^\s"<>]*blob\.core\.windows\.net[^\s"<>]*/g,'[upload reference redacted]'));process.exitCode=1});
