name: File Dock Store diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read publishing metadata
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        shell: node {0}
        run: |
          (async()=>{
            const r=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'})});if(!r.ok)throw new Error('Auth '+r.status);const token=(await r.json()).access_token;
            const root='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP';
            async function get(path=''){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('Read HTTP '+r.status);return r.json()}
            const app=await get();console.log('APP='+JSON.stringify(app));
            for(const [kind,ref] of [['published',app.lastPublishedApplicationSubmission],['pending',app.pendingApplicationSubmission]]){
              if(!ref)continue;const d=await get('/submissions/'+ref.id);const safe=Object.fromEntries(Object.entries(d).filter(([k])=>!['fileUploadUrl','listings','trailers'].includes(k)));
              console.log('METADATA='+JSON.stringify({kind,keys:Object.keys(d),...safe}));console.log('STATUS='+JSON.stringify(await get('/submissions/'+ref.id+'/status')));
            }
            if(app.pendingApplicationSubmission){const a=await get('/submissions/'+app.lastPublishedApplicationSubmission.id),b=await get('/submissions/'+app.pendingApplicationSubmission.id);function diff(x,y,p){if(JSON.stringify(x)===JSON.stringify(y))return;if(x&&y&&typeof x==='object'&&typeof y==='object'){for(const k of new Set([...Object.keys(x),...Object.keys(y)]))diff(x[k],y[k],p+'.'+k)}else console.log('LISTING_DIFF='+JSON.stringify({path:p,before:x,after:y}));}diff(a.listings,b.listings,'listings');}
          })().catch(e=>{console.error(e.message);process.exitCode=1});