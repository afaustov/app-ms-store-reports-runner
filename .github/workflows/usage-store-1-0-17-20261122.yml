name: Free widget Store recovery
on:
  workflow_dispatch:
    inputs:
      app_id: {type: string, required: true}
      package_filename: {type: string, required: true}
      mode: {type: choice, options: [inspect, prepare, context, commit, status], required: true}
      submission_id: {type: string, required: false}
permissions: {}
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ID: ${{ inputs.app_id }}
      PACKAGE_FILENAME: ${{ inputs.package_filename }}
      SUBMIT_MODE: ${{ inputs.mode }}
      SUBMISSION_ID: ${{ inputs.submission_id }}
      EXPECTED_SUBMISSION_ID: ${{ inputs.submission_id }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
    steps:
      - name: Inspect or recover the owned submission
        shell: node {0}
        run: |
          const __pipeline=(()=>{const module={exports:{}};
          'use strict';
          const {createDecipheriv,createHash}=require('node:crypto');
          const hash=v=>createHash('sha256').update(JSON.stringify(v)).digest('hex');
          const pricingHash=p=>{const {isAdvancedPricingModel,...economic}=p||{};return hash(economic);};
          const publicationHash=s=>hash({mode:s.targetPublishMode??null,date:s.targetPublishDate??null,visibility:s.visibility??null});
          function options(e){
           const version=e.PACKAGE_VERSION, bundleHash=e.PACKAGE_SHA256?.toUpperCase(),zipMd5=e.ZIP_MD5,zipBytes=Number(e.ZIP_BYTES),operationId=e.OPERATION_ID,runId=e.GITHUB_RUN_ID;
           if(!/^\d+\.\d+\.\d+\.\d+$/.test(version||'')||version.split('.').some(n=>Number(n)>65535))throw Error('Explicit four-part package version required');
           if(!/^[A-F0-9]{64}$/.test(bundleHash||''))throw Error('Verified bundle SHA256 required');
           if(!/^[A-Za-z0-9+/]{22}==$/.test(zipMd5||'')||!Number.isSafeInteger(zipBytes)||zipBytes<=0)throw Error('Verified ZIP MD5 and size required');
           if(!/^[a-zA-Z0-9-]{8,80}$/.test(operationId||'')||!/^\d+$/.test(runId||''))throw Error('Explicit operation and workflow run IDs required');
           return {version,bundleHash,zipMd5,zipBytes,operationId,runId};
          }
          function newerThanPublished(version,packages){
           const compare=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<4;i++){if(x[i]!==y[i])return x[i]-y[i];}return 0;};
           if(packages.some(p=>/^\d+\.\d+\.\d+\.\d+$/.test(p.version||'')&&compare(version,p.version)<=0))throw Error('Package version must exceed the published version');
          }
          function blobUrl(value,readable=false){
           const u=new URL(value);
           if(u.protocol!=='https:'||u.hostname!=='ingestionpackagesprod1.blob.core.windows.net'||!u.pathname.startsWith('/ingestion/')||u.username||u.password)throw Error('Unexpected Microsoft upload destination');
           if(readable&&!u.searchParams.get('sp')?.includes('r'))throw Error('Upload URL is not readable; preserve the created draft and use the legacy owned-draft recovery');
           return u;
          }
          function decrypt(encoded,key){
           if(!/^[a-fA-F0-9]{64}$/.test(key||''))throw Error('Invalid state encryption key');
           const b=Buffer.from(encoded||'','base64');if(b.length<29)throw Error('Missing encrypted upload context');
           const d=createDecipheriv('aes-256-gcm',Buffer.from(key,'hex'),b.subarray(0,12));d.setAAD(Buffer.from('free-widget-store-submission-v1'));d.setAuthTag(b.subarray(-16));
           const plain=Buffer.concat([d.update(b.subarray(12,-16)),d.final()]);try{return JSON.parse(plain);}finally{plain.fill(0);}
          }
          function bindContext(c,e){
           const o=options(e);
           if(c.pipelineVersion!==2||c.appId!==e.APP_ID||c.filename!==e.PACKAGE_FILENAME||!/^\d+$/.test(c.submissionId||''))throw Error('Upload context product mismatch');
           for(const k of Object.keys(o))if(c[k]!==o[k])throw Error('Upload context operation mismatch: '+k);
           blobUrl(c.uploadUrl,true);
          }
          function verifySubmission(c,s){
           if(String(s.id)!==String(c.submissionId)||s.pricing?.priceId!=='Free'||hash(s.listings)!==c.listingHash||pricingHash(s.pricing)!==c.pricingHash||publicationHash(s)!==c.publicationHash)throw Error('Owned submission baseline changed');
           const p=s.applicationPackages?.find(p=>p.fileName===c.filename);
           if(!p)throw Error('Owned submission package missing');return p;
          }
          const acceptedStates=new Set(['PreProcessing','Certification','Published']);
          const failed=s=>/fail|cancel|error/i.test(s||'');
          async function finish(c,{api,fetchImpl=fetch,now=Date.now,sleep=ms=>new Promise(r=>setTimeout(r,ms)),log=()=>{},uploadWaitMs=240000,ingestionWaitMs=480000,pollMs=10000}={}){
           blobUrl(c.uploadUrl,true);
           const base=`https://manage.devcenter.microsoft.com/v1.0/my/applications/${c.appId}`,sub=`${base}/submissions/${c.submissionId}`;
           let lastProgress='',existing=null;
           const emit=v=>{const key=JSON.stringify(v);if(key!==lastProgress){lastProgress=key;log(v);}};
           const deadline=now()+uploadWaitMs;let uploaded=false;
           emit({stage:'waiting-for-local-upload',submissionId:c.submissionId});
           while(now()<deadline){
            let r;try{r=await fetchImpl(c.uploadUrl,{method:'HEAD',redirect:'error',signal:AbortSignal.timeout(15000)});}catch{await sleep(3000);continue;}
            if(r.status===403){
             // A rerun after an expired SAS may only observe an already committed owned submission.
             existing=await api(sub);verifySubmission(c,existing);
             if(existing.status!=='PendingCommit')break;
             throw Error('Cannot verify the owned upload; no commit was sent');
            }
            if(r.ok){
             const h=r.headers;
             if(Number(h.get('content-length'))!==c.zipBytes||h.get('content-md5')!==c.zipMd5||h.get('x-ms-meta-operation')!==c.operationId||h.get('x-ms-meta-bundlehash')!==c.bundleHash||h.get('x-ms-meta-submissionid')!==c.submissionId)throw Error('Uploaded Blob does not match this operation; no commit was sent');
             uploaded=true;break;
            }
            if(r.status!==404&&r.status!==408&&r.status!==429&&r.status<500)throw Error('Upload verification failed: HTTP '+r.status);
            await sleep(3000);
           }
           if(!uploaded&&!existing)return {accepted:false,reason:'upload_timeout',submissionId:c.submissionId,commitSent:false};
           let s=existing||await api(sub);verifySubmission(c,s);
           let commitSent=false;
           if(s.status==='PendingCommit'){
            if(!uploaded)throw Error('No verified upload; commit blocked');
            const app=await api(base);
            if(String(app.pendingApplicationSubmission?.id)!==String(c.submissionId)||String(app.lastPublishedApplicationSubmission?.id)!==String(c.publishedId))throw Error('Application ownership or published baseline changed; commit blocked');
            // Exactly one POST. Lost responses are resolved by status reads, never by replay.
            commitSent=true;
            try{await api(sub+'/commit','POST');}catch{emit({stage:'commit-response-unknown',submissionId:c.submissionId});}
           }else if(failed(s.status))throw Error('Owned submission failed: '+s.status);
           const ingestionDeadline=now()+ingestionWaitMs;let lastDetailRead=-Infinity,observed=s.status,pkg=verifySubmission(c,s);
           while(now()<ingestionDeadline){
            let status;try{status=await api(sub+'/status');}catch{await sleep(pollMs);continue;}
            observed=status.status;
            if(failed(observed)||status.statusDetails?.errors?.length)throw Error('Store ingestion failed for owned submission '+c.submissionId+': '+observed);
            emit({stage:'processing',submissionId:c.submissionId,status:observed});
            if(acceptedStates.has(observed)&&now()-lastDetailRead>=15000){
             s=await api(sub);lastDetailRead=now();pkg=verifySubmission(c,s);
             if(pkg.fileStatus==='Uploaded'&&pkg.version===c.version){
              return {accepted:true,appId:c.appId,submissionId:c.submissionId,status:observed,version:pkg.version,packageStatus:pkg.fileStatus,packageId:pkg.id,bundleSha256:c.bundleHash,listingHash:c.listingHash,pricingUnchanged:true,listingUnchanged:true,publishMode:s.targetPublishMode,errors:status.statusDetails?.errors||[],warnings:status.statusDetails?.warnings||[],commitSent,verifiedAt:new Date(now()).toISOString()};
             }
            }
            await sleep(pollMs);
           }
           return {accepted:false,reason:'processing_timeout',appId:c.appId,submissionId:c.submissionId,status:observed,packageStatus:pkg?.fileStatus,version:pkg?.version||null,commitSent};
          }
          module.exports={options,newerThanPublished,blobUrl,decrypt,bindContext,verifySubmission,publicationHash,finish,hash,pricingHash};
          
          return module.exports;})();
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const fast = __pipeline;
          const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const pricingHash = value => { const {isAdvancedPricingModel,...economic}=value; return hash(economic); };
          const safe = value => String(value).replace(/https?:\/\/[^\s"<>]+/g, '[URL]');
          function summary(s) {
            return {id:s.id,status:s.status,pricing:s.pricing,publishMode:s.targetPublishMode,listingHash:hash(s.listings),locales:Object.keys(s.listings||{}),packages:(s.applicationPackages||[]).map(p=>({id:p.id,fileName:p.fileName,fileStatus:p.fileStatus,version:p.version,architecture:p.architecture})),details:s.statusDetails?{errors:s.statusDetails.errors,warnings:s.statusDetails.warnings}:undefined};
          }
          function encrypt(value) {
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', Buffer.from(process.env.STATE_ENCRYPTION_KEY,'hex'), iv);
            cipher.setAAD(Buffer.from('free-widget-store-submission-v1'));
            const data = Buffer.concat([cipher.update(JSON.stringify(value)),cipher.final()]);
            const encrypted=Buffer.concat([iv,data,cipher.getAuthTag()]).toString('base64');
            console.log('ENCRYPTED='+encrypted);
            if(value.pipelineVersion===2 && process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT,'encrypted_context='+encrypted+'\n');
          }
          async function main() {
          const appId = process.env.APP_ID;
          if (!/^9[A-Z0-9]{11}$/.test(appId || '')) throw new Error('Explicit Store product ID required.');
          const base = `https://manage.devcenter.microsoft.com/v1.0/my/applications/${appId}`;
          const filename = process.env.PACKAGE_FILENAME;
          if (!/^[A-Za-z0-9_.-]+[.]msixbundle$/.test(filename || '')) throw new Error('Explicit bundle filename required.');
            const mode=process.env.SUBMIT_MODE||'inspect';
            const pipeline=mode==='pipeline-prepare' ? fast.options(process.env) : null;
            const auth = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(process.env.MS_TENANT_ID)}/oauth2/token`,{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'})});
            const token = await auth.json();
            if (!auth.ok || !token.access_token) throw new Error(`Authentication failed: ${auth.status}`);
            async function api(url,method='GET',body) {
              const r = await fetch(url,{method,headers:{Authorization:`Bearer ${token.access_token}`,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(120000)});
              const raw = await r.text();
              if (!r.ok) throw new Error(`${method} ${new URL(url).pathname}: HTTP ${r.status} ${safe(raw).slice(0,6000)}`);
              return raw?JSON.parse(raw):{};
            }
            if(mode==='pipeline-finish') {
              const context=fast.decrypt(process.env.ENCRYPTED_CONTEXT,process.env.STATE_ENCRYPTION_KEY);
              fast.bindContext(context,process.env);
              const result=await fast.finish(context,{api,fetchImpl:fetch,log:row=>console.log('PROGRESS='+JSON.stringify(row))});
              console.log('RESULT='+JSON.stringify(result));
              if(!result.accepted)process.exitCode=2;
              return;
            }
            const app = await api(base);
            console.log('APPLICATION='+JSON.stringify({id:app.id,primaryName:app.primaryName,lastPublishedApplicationSubmission:app.lastPublishedApplicationSubmission,pendingApplicationSubmission:app.pendingApplicationSubmission}));
            const publishedId=app.lastPublishedApplicationSubmission?.id;
            const published=publishedId?await api(`${base}/submissions/${publishedId}`):null;
            if (published) console.log('PUBLISHED='+JSON.stringify(summary(published)));
            if (mode==='inspect') {
              const owned=await api(`${base}/submissions/1152921505702473532`);
              const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
              const differences=[];
              function diff(a,b,path='') { if(JSON.stringify(canonical(a))===JSON.stringify(canonical(b)))return; if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){ for(const key of new Set([...Object.keys(a),...Object.keys(b)]))diff(a[key],b[key],path+'/'+key); } else differences.push({path,before:a,after:b}); }
              diff(published.listings,owned.listings);
              console.log('LISTING_DIFF='+JSON.stringify({semanticEqual:differences.length===0,differences}));

              if(app.pendingApplicationSubmission?.id) console.log('PENDING='+JSON.stringify(summary(await api(`${base}/submissions/${app.pendingApplicationSubmission.id}`))));
              return;
            }
            if (!published) throw new Error('No published baseline; manual initial submission required.');
            if (published.pricing?.priceId !== 'Free') throw new Error('This skill handles Free products only; paid pricing must remain untouched.');
            if (mode==='prepare' || mode==='pipeline-prepare') {
              if (app.pendingApplicationSubmission?.id) throw new Error('Existing pending submission preserved; inspect before proceeding.');
              if(pipeline)fast.newerThanPublished(pipeline.version,published.applicationPackages||[]);
              let draft;
              try { draft=await api(`${base}/submissions`,'POST'); } catch(error) {
                // Creation is never replayed after an ambiguous response. Inspect the existing app only.
                const recovery=await api(base).catch(()=>null);
                console.log('RECOVERY='+JSON.stringify({pendingId:recovery?.pendingApplicationSubmission?.id||null,creationNotRetried:true}));
                throw error;
              }
              console.log('CREATED='+JSON.stringify({id:draft.id,status:draft.status}));
              if(hash(draft.listings)!==hash(published.listings)) throw new Error('Created listing differs from published baseline.');
              const uploadUrl=draft.fileUploadUrl;
              if(pipeline)fast.blobUrl(uploadUrl,true);
              if(draft.pricing?.priceId!=='Free') throw new Error('Pricing requires explicit safe normalization after inspection.');
              draft.applicationPackages=(draft.applicationPackages||[]).map(p=>({...p,fileStatus:'PendingDelete'}));
              draft.applicationPackages.push({fileName:filename,fileStatus:'PendingUpload',minimumDirectXVersion:'None',minimumSystemRam:'None'});
              await api(`${base}/submissions/${draft.id}`,'PUT',draft);
              const check=await api(`${base}/submissions/${draft.id}`);
              if(hash(check.listings)!==hash(published.listings)) throw new Error('Listing changed on update.');
              if(pricingHash(check.pricing)!==pricingHash(published.pricing)) throw new Error('Pricing changed on update.');
              if(fast.publicationHash(check)!==fast.publicationHash(published))throw new Error('Publication settings changed on update.');
              console.log('PREPARED='+JSON.stringify(summary(check)));
              encrypt({appId,submissionId:draft.id,uploadUrl,listingHash:hash(published.listings),pricingHash:pricingHash(published.pricing),filename,
                ...(pipeline ? {...pipeline,pipelineVersion:2,publishedId,publicationHash:fast.publicationHash(published)} : {})});
              return;
            }
            const id=process.env.SUBMISSION_ID;
            if(!/^\d+$/.test(id||'')) throw new Error('Explicit submission ID required.');
            const submission=await api(`${base}/submissions/${id}`);
            if(mode==='context') {
              if(id!==process.env.EXPECTED_SUBMISSION_ID||submission.status!=='PendingCommit') throw new Error('Unexpected owned draft.');
              if(hash(submission.listings)!==hash(published.listings)||pricingHash(submission.pricing)!==pricingHash(published.pricing)) throw new Error('Baseline listing/pricing mismatch.');
              if(!submission.applicationPackages?.some(p=>p.fileName===filename&&p.fileStatus==='PendingUpload')) throw new Error('Expected package missing.');
              console.log('PREPARED='+JSON.stringify(summary(submission)));
              encrypt({appId,submissionId:id,uploadUrl:submission.fileUploadUrl,listingHash:hash(published.listings),pricingHash:pricingHash(published.pricing),filename});
              return;
            }
            if(mode==='commit') {
              if(hash(submission.listings)!==hash(published.listings)||pricingHash(submission.pricing)!==pricingHash(published.pricing)) throw new Error('Baseline listing/pricing mismatch.');
              if(!submission.applicationPackages?.some(p=>p.fileName===filename)) throw new Error('Expected package missing.');
              if(submission.status!=='PendingCommit') throw new Error(`Unexpected commit state: ${submission.status}`);
              const result=await api(`${base}/submissions/${id}/commit`,'POST');
              console.log('COMMIT='+JSON.stringify(result));
            }
            console.log('SUBMISSION='+JSON.stringify(summary(await api(`${base}/submissions/${id}`))));
            console.log('STATUS='+JSON.stringify(await api(`${base}/submissions/${id}/status`)));
          }
          if(require.main===module)main().catch(error=>{console.error('FAILURE='+safe(error.message));process.exitCode=1;});
          module.exports={main};
          
