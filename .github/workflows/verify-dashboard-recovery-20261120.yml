name: Verify November 20 dashboard recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-dashboard-recovery-20261120.yml']

concurrency:
  group: cloud-reports
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Load public wrapper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Execute with encrypted checkpoints
        run: node scripts/run.js
        env:
          RUN_MODE: validate
          DASHBOARD_SOURCE: site
          DASHBOARD_SNAPSHOT_URL: https://store-widgets-dashboard.fironaust.chatgpt.site/api/snapshot
          DASHBOARD_SNAPSHOT_TOKEN: ${{ secrets.DASHBOARD_SNAPSHOT_TOKEN }}
          DASHBOARD_ALLOW_PARTIAL: 'true'
          MS_STORE_SOURCE_RUN_ID: ''
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_SOURCE_REPOSITORY: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          SOURCE_KNOWN_HOSTS: ${{ vars.SOURCE_KNOWN_HOSTS }}
          REVIEW_FEED_REPOSITORY: ${{ vars.REVIEW_FEED_REPOSITORY }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENDA_RUNTIME_INCIDENTS_DATA_SOURCE_ID: ${{ secrets.AGENDA_RUNTIME_INCIDENTS_DATA_SOURCE_ID }}
          AGENDA_GITHUB_READ_TOKEN: ${{ secrets.AGENDA_GITHUB_READ_TOKEN }}
          REVIEW_FEED_DEPLOY_KEY: ${{ secrets.REVIEW_FEED_DEPLOY_KEY }}
