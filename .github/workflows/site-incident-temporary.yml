name: Temporary incident Site setup
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt incident connection
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENDA_RUNTIME_INCIDENTS_DATA_SOURCE_ID: ${{ secrets.AGENDA_RUNTIME_INCIDENTS_DATA_SOURCE_ID }}
          PUBLIC_KEY: 
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const key = Buffer.from(process.env.PUBLIC_KEY, "base64").toString();
          for (const name of ["NOTION_TOKEN", "AGENDA_RUNTIME_INCIDENTS_DATA_SOURCE_ID"]) {
            if (!process.env[name]) throw new Error("Missing required configuration");
            console.log("ENCRYPTED_" + name + "=" + crypto.publicEncrypt({key, oaepHash:"sha256"}, Buffer.from(process.env[name])).toString("base64"));
          }
          NODE
