name: File Dock modular API probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only File Dock API capabilities
        shell: node {0}
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          (async()=>{
            async function token(resource){const r=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource})});const d=await r.json();if(!r.ok){console.log('TOKEN_ERROR='+JSON.stringify({resource,http:r.status,error:d.error,codes:d.error_codes,correlation:d.correlation_id}));return null}return d.access_token;}
            function safe(d){if(Array.isArray(d))return d.map(safe);if(d&&typeof d==='object')return Object.fromEntries(Object.entries(d).filter(([k])=>!/url|uri|token|listings/i.test(k)).map(([k,v])=>[k,safe(v)]));return d;}
            async function get(url,t,extra={}){const r=await fetch(url,{headers:{Authorization:'Bearer '+t,'X-ClientName':'StoreBroker FileDock recovery probe',...extra}});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d={text:raw.slice(0,300)}}console.log('GET='+JSON.stringify({url,http:r.status,correlation:r.headers.get('MS-CorrelationId')||r.headers.get('X-CorrelationId'),data:safe(d)}));return r.ok?d:null;}
            const legacy=await token('https://manage.devcenter.microsoft.com');
            if(legacy){const root='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP';const a=await get(root,legacy);if(a?.pendingApplicationSubmission){await get(root+'/submissions/'+a.pendingApplicationSubmission.id,legacy);await get(root+'/submissions/'+a.pendingApplicationSubmission.id+'/status',legacy);}}
            const modern=await token('https://api.partner.microsoft.com');
            if(modern)await get('https://api.partner.microsoft.com/v1.0/ingestion/products?externalId=9NQJ0XTPV4RP&resourceTypes=Application',modern);
            const unpackaged=await token('https://api.store.microsoft.com');
            if(unpackaged)await get('https://api.store.microsoft.com/submission/v1/product/9NQJ0XTPV4RP/metadata/availability',unpackaged,{'X-Seller-Account-Id':'93106630'});
          })().catch(e=>{console.error(e.message);process.exitCode=1});
