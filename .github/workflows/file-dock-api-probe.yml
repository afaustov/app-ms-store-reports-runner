name: File Dock final API state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published and pending versions
        shell: node {0}
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          (async()=>{
            const auth=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'}),signal:AbortSignal.timeout(45000)});
            if(!auth.ok)throw Error('Authentication HTTP '+auth.status);
            const t=(await auth.json()).access_token;
            const root='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP';
            async function get(p=''){const r=await fetch(root+p,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('GET HTTP '+r.status);return r.json();}
            const a=await get();
            async function read(ref){if(!ref)return null;const d=await get('/submissions/'+ref.id);return {id:d.id,status:d.status,mode:d.targetPublishMode,pricing:d.pricing,packages:d.applicationPackages.map(p=>({fileName:p.fileName,version:p.version,status:p.fileStatus})),errors:d.statusDetails.errors};}
            console.log('VERIFIED_STATE='+JSON.stringify({published:await read(a.lastPublishedApplicationSubmission),pending:await read(a.pendingApplicationSubmission)}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});