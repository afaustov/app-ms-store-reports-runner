name: File Dock draft only
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare, inspect]
        default: inspect
permissions:
  contents: read
concurrency:
  group: file-dock-store-recovery
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare or inspect without committing
        shell: node {0}
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          const crypto=require('node:crypto');
          (async()=>{
            const auth=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'})});
            if(!auth.ok)throw Error('Auth HTTP '+auth.status);const token=(await auth.json()).access_token;
            const root='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP';
            async function api(p='',method='GET',body){const r=await fetch(root+p,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error('API '+r.status+': '+t);return t?JSON.parse(t):{};}
            const canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v;
            const same=(a,b)=>JSON.stringify(canon(a))===JSON.stringify(canon(b));
            let app=await api();
            if(app.lastPublishedApplicationSubmission.id!=='1152921505702146390')throw Error('Published baseline changed');
            const original=await api('/submissions/'+app.lastPublishedApplicationSubmission.id);
            if(process.env.OPERATION==='prepare'){
              if(app.pendingApplicationSubmission){const d=await api('/submissions/'+app.pendingApplicationSubmission.id);if(d.id!=='1152921505702158990'||d.status!=='CommitFailed')throw Error('Preserve unrelated pending work');await api('/submissions/'+d.id,'DELETE');}
              const draft=await api('/submissions','POST');
              if(draft.status!=='PendingCommit')throw Error('Unexpected new draft state');
              const upload=draft.fileUploadUrl;
              draft.listings=structuredClone(original.listings);
              draft.applicationPackages=structuredClone(original.applicationPackages);
              if(draft.applicationPackages.length!==1||draft.applicationPackages[0].version!=='1.0.10.0')throw Error('Unexpected package baseline');
              draft.applicationPackages[0].fileStatus='PendingDelete';
              draft.applicationPackages.push({fileName:'File_Dock_Widget_1.0.11.0_neutral.msixbundle',fileStatus:'PendingUpload',minimumDirectXVersion:'None',minimumSystemRam:'None'});
              draft.pricing=structuredClone(original.pricing);draft.pricing.priceId='Tier1017';delete draft.pricing.sales;
              await api('/submissions/'+draft.id,'PUT',draft);
              const readback=await api('/submissions/'+draft.id);
              if(readback.status!=='PendingCommit'||readback.pricing.priceId!=='Tier1017'||!same(original.listings,readback.listings))throw Error('Draft readback mismatch');
              const a=structuredClone(original.pricing),b=structuredClone(readback.pricing);for(const o of [a,b]){delete o.priceId;delete o.isAdvancedPricingModel;}if(!same(a,b))throw Error('Trial/market settings changed');
              for(const k of Object.keys(original))if(!['id','friendlyName','status','statusDetails','fileUploadUrl','applicationPackages','pricing','packageDeliveryOptions'].includes(k)&&!same(original[k],readback[k]))throw Error('Unexpected metadata change: '+k);
              const nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',Buffer.from(process.env.STATE_ENCRYPTION_KEY,'hex'),nonce);
              const encrypted=Buffer.concat([cipher.update(JSON.stringify({id:draft.id,url:readback.fileUploadUrl||upload})),cipher.final()]);
              console.log('UPLOAD_ENVELOPE='+Buffer.concat([nonce,encrypted,cipher.getAuthTag()]).toString('base64'));
              app=await api();
            }else if(process.env.OPERATION!=='inspect')throw Error('Unsupported operation');
            if(!app.pendingApplicationSubmission)throw Error('No pending draft');
            const d=await api('/submissions/'+app.pendingApplicationSubmission.id);
            if(!same(original.listings,d.listings)||d.pricing.priceId!=='Tier1017')throw Error('Final metadata mismatch');
            console.log('DRAFT_VERIFIED='+JSON.stringify({id:d.id,status:d.status,priceId:d.pricing.priceId,listingsUnchanged:true,packages:d.applicationPackages.map(p=>({fileName:p.fileName,status:p.fileStatus,version:p.version})),published:app.lastPublishedApplicationSubmission.id}));
          })().catch(e=>{console.error(e.message.replace(/https:\/\/[^\s"<>]*blob\.core\.windows\.net[^\s"<>]*/g,'[upload reference redacted]'));process.exitCode=1});
