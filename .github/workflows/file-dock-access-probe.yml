name: File Dock submission access probe
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [prepare, commit, status]
        default: status
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Recover File Dock 1.0.11
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          OPERATION: ${{ inputs.operation }}
        shell: node {0}
        run: |
          const {createCipheriv,randomBytes,createHash}=require('node:crypto');
          (async()=>{
            const auth=await fetch('https://login.microsoftonline.com/'+process.env.MS_TENANT_ID+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'})});
            if(!auth.ok)throw new Error('Auth HTTP '+auth.status);
            const token=(await auth.json()).access_token;
            const base='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP/submissions/1152921505702158807';
            async function api(suffix='',method='GET',body){
              const r=await fetch(base+suffix,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
              const raw=await r.text(); let d;try{d=JSON.parse(raw)}catch{d={}}
              if(!r.ok){console.log(JSON.stringify({http:r.status,code:d.code,message:d.message}));throw new Error('Submission request failed')}
              return d;
            }
            let draft=await api();
            console.log(JSON.stringify({id:draft.id,status:draft.status,targetPublishMode:draft.targetPublishMode,packages:draft.applicationPackages.map(p=>({fileName:p.fileName,fileStatus:p.fileStatus,version:p.version}))}));
            if(process.env.OPERATION==='prepare'){
              if(draft.status!=='PendingCommit')throw new Error('Unexpected draft state');
              const original=structuredClone(draft);
              if(draft.applicationPackages.length!==1||draft.applicationPackages[0].version!=='1.0.10.0')throw new Error('Unexpected package baseline');
              draft.applicationPackages[0].fileStatus='PendingDelete';
              draft.applicationPackages.push({fileName:'File_Dock_Widget_1.0.11.0_neutral.msixbundle',fileStatus:'PendingUpload',minimumDirectXVersion:'None',minimumSystemRam:'None'});
              draft.targetPublishMode='Immediate';
              delete draft.pricing;
              const updated=await api('','PUT',draft);
              for(const k of Object.keys(original))if(!['applicationPackages','targetPublishMode','status','statusDetails','fileUploadUrl'].includes(k)&&JSON.stringify(original[k])!==JSON.stringify(updated[k]))throw new Error('Unexpected changed field '+k);
              const nonce=randomBytes(12),cipher=createCipheriv('aes-256-gcm',Buffer.from(process.env.STATE_ENCRYPTION_KEY,'hex'),nonce);
              const ciphertext=Buffer.concat([cipher.update(JSON.stringify({id:draft.id,url:updated.fileUploadUrl||draft.fileUploadUrl})),cipher.final()]);
              console.log('UPLOAD_ENVELOPE='+Buffer.concat([nonce,ciphertext,cipher.getAuthTag()]).toString('base64'));
              console.log('PREPARED');
            }else if(process.env.OPERATION==='commit'){
              if(draft.status!=='PendingCommit')throw new Error('Commit refused: unexpected state');
              const old=draft.applicationPackages.find(p=>p.fileName==='File_Dock_Widget_1.0.11.0_neutral.msixbundle');
              if(!old||!draft.applicationPackages.some(p=>p.version==='1.0.10.0'&&p.fileStatus==='PendingDelete'))throw new Error('Unexpected rollback packages');
              console.log('COMMIT_RESULT='+JSON.stringify(await api('/commit','POST')));
            }
            console.log('SUBMISSION_STATUS='+JSON.stringify(await api('/status')));
          })().catch(e=>{console.error(e.message);process.exitCode=1});