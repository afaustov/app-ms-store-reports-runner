name: Acquisition API diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-reports
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Load private diagnostic source
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ vars.SOURCE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          probe_root="$RUNNER_TEMP/acquisition-api-probe"
          mkdir -p "$probe_root"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$probe_root/key"
          printf '%s\n' "$SOURCE_KNOWN_HOSTS" > "$probe_root/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $probe_root/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$probe_root/known_hosts"
          git clone --quiet --depth 1 --single-branch --branch feat/ms-store-trial-counts git@github.com:afaustov/app-ms-store-reports.git "$probe_root/source"
          rm -f "$probe_root/key"
      - name: Check acquisition fields and values
        working-directory: ${{ runner.temp }}/acquisition-api-probe/source
        run: node scripts/acquisition-api-probe.mjs
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      - name: Remove private working files
        if: always()
        shell: bash
        run: |
          probe_root="$RUNNER_TEMP/acquisition-api-probe"
          test "$probe_root" = "$RUNNER_TEMP/acquisition-api-probe"
          rm -rf -- "$probe_root"
