name: File Dock bounded API matrix
on:
  workflow_dispatch:
    inputs:
      bundle_envelope:
        type: string
        required: true
      initial_draft:
        type: string
        default: '1152921505702160440'
permissions:
  contents: read
concurrency:
  group: file-dock-store-recovery
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      BUNDLE_ENVELOPE: ${{ inputs.bundle_envelope }}
      INITIAL_DRAFT: ${{ inputs.initial_draft }}
    steps:
      - name: Verify signed artifact and current ownership
        shell: node {0}
        run: |
          require('node:fs').writeFileSync('matrix.cjs',Buffer.from('','base64'));
          require('node:child_process').execFileSync(process.execPath,['matrix.cjs','init'],{stdio:'inherit'});
      - name: Case patch-json
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs patch-json
      - name: Case patch-merge
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs patch-merge
      - name: Case combined
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs combined
      - name: Case us-tier
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs us-tier
      - name: Case us-base
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs us-base
      - name: Case strip-readonly
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs strip-readonly
      - name: Case omit-date
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs omit-date
      - name: Case future-date
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs future-date
      - name: Case msixupload
        if: ${{ env.FOUND_VALID != 'true' && env.ABORT_MATRIX != 'true' }}
        run: node matrix.cjs msixupload
      - name: Persist compact outcome in job summary
        if: always()
        run: |
          node matrix.cjs summary
          cat recovery-state.json >> "$GITHUB_STEP_SUMMARY"
