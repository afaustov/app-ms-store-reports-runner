name: File Dock commit existing draft 9101
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [commit, watch]
        default: watch
permissions: {}
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Commit exact draft without price or listing writes
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          COMMIT_MODE: ${{ inputs.mode }}
        run: |
          node <<'NODE'
          const crypto=require('node:crypto');
          const id='1152921505702169101';const base='https://manage.devcenter.microsoft.com/v1.0/my/applications/9NQJ0XTPV4RP';
          const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
          const same=(a,b)=>JSON.stringify(canonical(a))===JSON.stringify(canonical(b));
          const hash=v=>crypto.createHash('sha256').update(JSON.stringify(v)).digest('hex');
          const safe=v=>String(v).replace(/https?:\/\/[^\s"<>]+/g,'[URL]');
          const summary=s=>({id:s.id,status:s.status,pricing:s.pricing,listingHash:hash(s.listings),packages:(s.applicationPackages||[]).map(p=>({fileName:p.fileName,version:p.version,fileStatus:p.fileStatus})),statusDetails:s.statusDetails});
          (async()=>{
           const a=await fetch(`https://login.microsoftonline.com/${process.env.MS_TENANT_ID}/oauth2/token`,{method:'POST',body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MS_CLIENT_ID,client_secret:process.env.MS_CLIENT_SECRET,resource:'https://manage.devcenter.microsoft.com'})});const t=await a.json();if(!a.ok||!t.access_token)throw Error('Authentication HTTP '+a.status);
           async function api(path='',method='GET'){const r=await fetch(base+path,{method,headers:{Authorization:`Bearer ${t.access_token}`,'Content-Type':'application/json'},signal:AbortSignal.timeout(90000)});const raw=await r.text();if(!r.ok)throw Error(`HTTP ${r.status} ${safe(raw).slice(0,3000)}`);return raw?JSON.parse(raw):{};}
           const app=await api();const live=await api('/submissions/'+app.lastPublishedApplicationSubmission.id);const s=await api('/submissions/'+id);
           console.log('PUBLISHED_BEFORE='+JSON.stringify(summary(live)));console.log('SUBMISSION_BEFORE='+JSON.stringify(summary(s)));
           if(process.env.COMMIT_MODE==='commit'){
            if(app.pendingApplicationSubmission?.id!==id||live.id!=='1152921505702161363'||s.status!=='PendingCommit')throw Error('Ownership or state changed; no commit repeated.');
            if(hash(s.listings)!==hash(live.listings)||hash(live.listings)!=='859b67925ed78d49d47f89f00f6f6ed6db28b31fb88e856eaa8dd4a95b06910d')throw Error('Listing baseline mismatch.');
            const expected={...live.pricing,priceId:'Tier1017'};const actual={...s.pricing};delete expected.isAdvancedPricingModel;delete actual.isAdvancedPricingModel;
            if(!same(expected,actual))throw Error('Pricing baseline mismatch.');
            if(!s.applicationPackages?.some(p=>p.fileName==='File_Dock_Widget_1.0.12.0_neutral.msixbundle'&&p.fileStatus==='PendingUpload'))throw Error('Expected pending package missing.');
            console.log('COMMIT_REQUEST='+JSON.stringify({id,method:'POST',bodyProvided:false}));
            console.log('COMMIT_RESPONSE='+JSON.stringify(await api('/submissions/'+id+'/commit','POST')));
           }else if(process.env.COMMIT_MODE!=='watch')throw Error('Unsupported mode.');
           for(let attempt=0;attempt<18;attempt++){
            const status=await api('/submissions/'+id+'/status');console.log('STATUS='+JSON.stringify({capturedAt:new Date().toISOString(),...status}));
            if(status.status!=='CommitStarted')break;
            await new Promise(r=>setTimeout(r,15000));
           }
           console.log('SUBMISSION_AFTER='+JSON.stringify(summary(await api('/submissions/'+id))));
           const after=await api();console.log('APPLICATION_AFTER='+JSON.stringify({published:after.lastPublishedApplicationSubmission,pending:after.pendingApplicationSubmission}));
           console.log('PUBLISHED_AFTER='+JSON.stringify(summary(await api('/submissions/'+after.lastPublishedApplicationSubmission.id))));
          })().catch(e=>{console.error('FAILURE='+safe(e.message));process.exitCode=1;});
          
          NODE
