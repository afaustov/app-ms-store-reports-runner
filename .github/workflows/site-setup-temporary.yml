name: Temporary secure Site setup
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt configuration for the Site owner
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          PUBLIC_KEY: 
        run: |
          node <<'NODE'
          const crypto = require("crypto");
          const key = Buffer.from(process.env.PUBLIC_KEY, "base64").toString();
          for (const name of ["MS_TENANT_ID", "MS_CLIENT_ID", "MS_CLIENT_SECRET", "MS_STORE_APP_ID"]) {
            if (!process.env[name]) throw new Error("Missing required configuration");
            const encrypted = crypto.publicEncrypt({key, oaepHash:"sha256"}, Buffer.from(process.env[name]));
            console.log("ENCRYPTED_" + name + "=" + encrypted.toString("base64"));
          }
          NODE
